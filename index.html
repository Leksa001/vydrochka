<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<meta name="mobile-web-app-capable" content="yes">

<title>Выдрочка</title>
<meta name="theme-color" content="#EEE8E3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Макет: телефон по центру; на широком экране слева шпаргалка для показа, кабинет магазина раскрывается в широкое окно.
   Цвета и формы взяты из дизайн-макетов команды (бежевый фон, чёрные пилюли, крупные скругления). Тема одна, светлая — так задумано брендом. */
:root{
  --bg:#EEE8E3; --paper:#F7F3EF; --card:#E6DED7; --ink:#1E1A17; --ink-2:#4A433E; --muted:#857B74; --line:#DDD3CB; --white:#FFFFFF;
  --ok:#3D7A57; --ok-bg:#E1EDE4; --warn:#9A6414; --warn-bg:#F3E6CF; --bad:#A8443A; --bad-bg:#F3DEDA;
  --f:"Manrope",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r-xl:28px; --r-l:20px; --r-m:14px; --pill:999px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--card);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
img{display:block;max-width:100%}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

#stage{height:100%;display:flex;justify-content:center;align-items:center;gap:40px;padding:24px}
#guide{width:320px;flex:none;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
#guide h2{font-size:22px}
#guide .lead{color:var(--ink-2);font-size:14px}
#guide ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
#guide li button{width:100%;text-align:left;background:var(--paper);border-radius:var(--r-m);padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
#guide li button:hover{background:var(--white)}
#guide li b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:12px}
#guide .links{display:flex;flex-wrap:wrap;gap:8px}
#phone{width:400px;height:min(860px,100%);background:var(--bg);border-radius:44px;box-shadow:0 0 0 10px var(--ink),0 30px 60px rgba(30,26,23,.25);display:flex;flex-direction:column;overflow:hidden;position:relative;flex:none;transition:width .25s}
#phone.wide{width:min(1060px,calc(100vw - 420px));border-radius:24px;box-shadow:0 0 0 1px var(--line),0 30px 60px rgba(30,26,23,.15)}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
@media (max-width:900px){
  #stage{padding:0;display:block}
  #guide{display:none}
  #phone,#phone.wide{width:100%;height:100%;border-radius:0;box-shadow:none}
}

/* общие элементы */
.scr{padding:18px 16px 24px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:12px}
.top .grow{flex:1;min-width:0}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:48px;height:48px;border-radius:50%;mix-blend-mode:multiply}
.brand b{font-size:24px;font-weight:800;letter-spacing:-.03em}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.ibtn{width:44px;height:44px;border-radius:50%;background:var(--paper);display:grid;place-items:center;flex:none}
.ibtn svg{width:22px;height:22px}
.back{display:flex;align-items:center;gap:8px;font-weight:600}
.h1{font-size:30px;font-weight:800;line-height:1.1}
.h2{font-size:20px;font-weight:800}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.link{font-size:14px;font-weight:600;color:var(--ink-2)}
.search{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:var(--pill);padding:0 8px 0 18px;height:54px}
.search svg{width:22px;height:22px;flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:42px;padding:0 18px;border-radius:var(--pill);border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn{height:50px;padding:0 22px;border-radius:var(--pill);background:var(--ink);color:var(--paper);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.sm{height:38px;padding:0 16px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.hscroll::-webkit-scrollbar{display:none}
.pcard{flex:none;width:132px;display:flex;flex-direction:column;gap:6px;text-align:left;position:relative}
.pcard .ph{background:var(--white);border-radius:var(--r-l);aspect-ratio:1/1.05;display:grid;place-items:center;overflow:hidden}
.pcard .ph img{width:82%;height:82%;object-fit:contain}
.pcard .st{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.pcard .nm{font-size:13px;color:var(--ink-2)}
.pcard .pr{font-weight:700}
.heart{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center}
.heart svg{width:17px;height:17px}
.heart.on svg{fill:var(--ink)}
.ad{position:absolute;left:8px;top:8px;font-size:10px;font-weight:700;background:rgba(255,255,255,.9);padding:2px 7px;border-radius:var(--pill);color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .pcard{width:auto}
.banner{background:var(--card);border-radius:var(--r-xl);padding:22px;display:flex;align-items:center;gap:8px;overflow:hidden;position:relative;min-height:190px}
.banner .txt{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1;max-width:60%}
.banner h2{font-size:28px;font-weight:800;line-height:1.05}
.banner img{position:absolute;right:-6px;bottom:0;width:44%;height:auto;max-height:100%;object-fit:contain;object-position:bottom right;mix-blend-mode:multiply}
.lookblock{display:grid;grid-template-columns:1.05fr 1fr;gap:10px}
.lookblock .model{background:var(--card);border-radius:var(--r-xl);overflow:hidden;position:relative;display:flex;flex-direction:column}
.lookblock .model h3{position:absolute;top:14px;left:16px;font-size:18px;font-weight:800;z-index:1}
.lookblock .model img{flex:1;width:100%;object-fit:cover;mix-blend-mode:multiply;min-height:0}
.lookblock .model .btn{position:absolute;left:10px;right:10px;bottom:10px;height:44px;font-size:13px}
.mini{background:var(--paper);border-radius:var(--r-l);padding:8px;display:flex;gap:8px;align-items:center;text-align:left;width:100%}
.mini img{width:58px;height:58px;object-fit:contain;flex:none;background:var(--white);border-radius:12px}
.mini .t{min-width:0;flex:1}
.mini b{display:block;font-size:13px}
.mini span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini i{font-style:normal;font-weight:700;font-size:13px}
.col{display:flex;flex-direction:column;gap:8px}
.feat{display:flex;gap:10px}
.feat button{flex:1;background:var(--paper);border-radius:var(--pill);height:46px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600}
.feat button.on{background:var(--ink);color:var(--paper)}
.ai{background:var(--card);border-radius:var(--r-xl);padding:20px;display:flex;gap:12px;align-items:center}
.ai .txt{flex:1;display:flex;flex-direction:column;gap:8px}
.ai h3{font-size:18px;font-weight:800}
.ai p{font-size:13px;color:var(--ink-2)}
.ai img{width:96px;border-radius:10px;transform:rotate(-4deg);box-shadow:0 6px 14px rgba(0,0,0,.12);border:4px solid var(--white)}
.tabbar{display:flex;justify-content:space-around;background:var(--paper);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));flex:none}
.tabbar[hidden]{display:none}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-weight:600;padding:2px 10px;position:relative}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--ink)}
.tabbar button.on::after{content:"";position:absolute;bottom:-4px;left:12px;right:12px;height:2px;background:var(--ink);border-radius:2px}
.tabbar .cnt{position:absolute;top:-3px;right:10px;background:var(--ink);color:var(--paper);font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.store{display:flex;gap:12px;align-items:center;background:var(--paper);border-radius:var(--r-l);padding:10px;text-align:left;width:100%}
.store img{width:64px;height:64px;border-radius:14px;object-fit:cover;flex:none}
.store .t{flex:1;min-width:0}
.store b{display:block}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:var(--pill);white-space:nowrap}
.store .pill,.avail .pill{white-space:normal}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.n{background:var(--card);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.n::before{display:none}
.panel{background:var(--paper);border-radius:var(--r-l);padding:16px;display:flex;flex-direction:column;gap:12px}
.hero-img{background:var(--white);border-radius:var(--r-xl);aspect-ratio:1/1;display:grid;place-items:center;position:relative}
.hero-img img{width:70%;height:70%;object-fit:contain}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.size{min-width:48px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-weight:700}
.size.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.size.off{color:var(--muted);text-decoration:line-through}
.avail{display:flex;flex-direction:column;gap:8px}
.avail .a{background:var(--paper);border-radius:var(--r-m);padding:12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.avail .a .r{grid-row:span 2;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.note{font-size:12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700}
.field input,.field select,.field textarea{height:48px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--paper);padding:0 14px;outline:none}
.field textarea{height:auto;padding:12px 14px;resize:vertical}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--ink);color:var(--paper);border-radius:var(--r-m);padding:12px 16px;font-size:14px;font-weight:600;z-index:20;animation:tin .2s ease-out}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#screen{scroll-behavior:auto}}
.msg{background:var(--paper);border-radius:18px 18px 18px 6px;padding:12px 14px;font-size:14px;align-self:flex-start;max-width:92%}
.msg.me{background:var(--ink);color:var(--paper);border-radius:18px 18px 6px 18px;align-self:flex-end}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{background:var(--paper);border:1px solid var(--line);border-radius:var(--pill);padding:8px 14px;font-size:13px;font-weight:600}
.litem{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;background:var(--paper);border-radius:var(--r-l);padding:10px}
.litem img{width:72px;height:72px;object-fit:contain;background:var(--white);border-radius:14px}
.litem .t{min-width:0;display:flex;flex-direction:column;gap:2px}
.litem .t b{font-size:14px}
.litem .act{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.sum{background:var(--ink);color:var(--paper);border-radius:var(--r-l);padding:16px;display:flex;flex-direction:column;gap:10px}
.sum .between span{opacity:.75;font-size:13px}
.sum .btn{background:var(--paper);color:var(--ink)}
.map{background:#E3DBD2;border-radius:var(--r-xl);overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.qrbox{background:var(--white);border-radius:var(--r-xl);padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.qr{width:170px;height:170px;display:grid;place-items:center}
.code{font-size:28px;font-weight:800;letter-spacing:.08em}
.empty{text-align:center;padding:30px 10px;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--ink-2)}
.empty img{width:150px;mix-blend-mode:multiply}
.seg{display:flex;background:var(--paper);border-radius:var(--pill);padding:4px;gap:4px}
.seg button{flex:1;height:38px;border-radius:var(--pill);font-weight:700;font-size:13px}
.seg button.on{background:var(--ink);color:var(--paper)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2)}
.check input{width:20px;height:20px;accent-color:var(--ink);flex:none;margin-top:1px}
.demo{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-bg);padding:3px 8px;border-radius:6px;align-self:flex-start}

/* кабинет магазина */
.cab{display:grid;grid-template-columns:210px 1fr;min-height:100%}
.cab nav{background:var(--ink);color:var(--paper);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.cab nav .brand b{font-size:18px;color:var(--paper)}
.cab nav .brand img{width:38px;height:38px;mix-blend-mode:normal;background:var(--paper)}
.cab nav button{text-align:left;padding:10px 12px;border-radius:12px;font-weight:600;font-size:14px;color:rgba(247,243,239,.7)}
.cab nav button.on{background:rgba(247,243,239,.12);color:var(--paper)}
.cab nav .sp{flex:1}
.cab nav select{background:rgba(247,243,239,.12);border:0;border-radius:10px;padding:8px;color:var(--paper);font-size:13px}
.cab nav select option{color:var(--ink)}
.cab main{padding:24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--paper);border-radius:var(--r-l);padding:14px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-size:26px;font-weight:800}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.funnel{display:flex;flex-direction:column;gap:8px}
.fbar{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;font-size:13px}
.fbar .tr{height:24px;background:var(--card);border-radius:8px;overflow:hidden}
.fbar .tr i{display:block;height:100%;background:var(--ink);border-radius:8px}
.tbl{overflow-x:auto;background:var(--paper);border-radius:var(--r-l)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
tr:last-child td{border-bottom:0}
td input.q{width:52px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--white);text-align:center}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
pre.json{background:var(--ink);color:#EDE6DF;border-radius:var(--r-m);padding:14px;font-size:12px;overflow-x:auto;margin:0;font-family:ui-monospace,Consolas,monospace}
.tariffs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tariff{background:var(--paper);border-radius:var(--r-l);padding:16px;display:flex;flex-direction:column;gap:8px}
.tariff.cur{box-shadow:inset 0 0 0 2px var(--ink)}
.tariff ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
@media (max-width:760px){
  .cab{grid-template-columns:1fr}
  .cab nav{flex-direction:row;flex-wrap:wrap;padding:12px}
  .cab nav .brand{width:100%}
  .cab nav .sp{display:none}
  .cab main{padding:16px}
  .kpis{grid-template-columns:1fr 1fr}
  .cols2,.tariffs{grid-template-columns:1fr}
  .fbar{grid-template-columns:110px 1fr 44px}
}
</style>

<div id="stage">
  <aside id="guide">
    <div class="brand"><img src="img/logo.jpg" alt=""><div><b>Выдрочка</b><small>прототип для команды · Тюмень</small></div></div>
    <p class="lead">Кликабельный прототип по нашему дизайну. Товары, магазины и цифры здесь демонстрационные. Всё, что вы делаете, сохраняется только в этом браузере.</p>
    <h2>Сценарий показа</h2>
    <ol>
      <li><button data-go="onb"><b>1</b>Анкета: город, размер, стиль, бюджет</button></li>

      <li><button data-go="look"><b>3</b>Заменить вещь, увидеть маршрут по магазинам</button></li>
      <li><button data-go="product"><b>4</b>Карточка: наличие по размерам в каждом магазине</button></li>

      <li><button data-go="cabinet"><b>6</b>Кабинет магазина: выдать бронь по коду</button></li>
      <li><button data-go="demand"><b>7</b>Спрос: что ищут в городе и не находят</button></li>
    </ol>
    <div class="links">
      <a class="btn sm" href="docs.html" target="_blank" rel="noopener">Документация проекта</a>
      <button class="btn sm ghost" data-go="reset">Сбросить демо</button>
    </div>
  </aside>
  <div id="phone">
    <div id="screen"></div>
    <nav class="tabbar" id="tabbar"></nav>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tensorflow/4.22.0/tf.min.js"></script>
<script>
/* ================= ДАННЫЕ (демо) ================= */
const STORES = [
  {id:'stil1', name:'Стиль+',  branch:'ул. Республики',      x:47, y:38, sync:'1С:Розница', upd:8,    hours:'10:00–22:00', photo:'store1.jpg'},
  {id:'stil2', name:'Стиль+',  branch:'ул. Мельникайте',     x:73, y:62, sync:'1С:Розница', upd:8,    hours:'10:00–21:00', photo:'store2.jpg'},
  {id:'moda',  name:'Мода24',  branch:'ул. Ленина',          x:35, y:54, sync:'МойСклад',   upd:14,   hours:'10:00–21:00', photo:'store3.jpg'},
  {id:'obuv',  name:'Обувь.Ру',branch:'ул. Герцена',         x:61, y:27, sync:'Excel-файл', upd:1560, hours:'10:00–20:00', photo:'store4.jpg'},
  {id:'trendy',name:'Trendy',  branch:'ул. 50 лет Октября',  x:24, y:33, sync:'Эвотор',     upd:22,   hours:'10:00–22:00', photo:'store1.jpg'},
  {id:'base',  name:'База',    branch:'ул. Широтная',        x:84, y:21, sync:'вручную',    upd:3000, hours:'11:00–20:00', photo:'store3.jpg'},

function parseQuery(q){
  const t = q.toLowerCase();
  let budget = null;
  const m = t.match(/(\d[\d\s]*\d|\d)\s*(к|k|тыс)?/);
  if (m){ let n = parseInt(m[1].replace(/\s/g, ''), 10); if (m[2]) n *= 1000; if (n >= 500) budget = n; }
  const tags = [];
  if (/уч[её]б|универ|пар[ыау]|колледж|институт|тиу/.test(t)) tags.push('учёба');
  if (/офис|работ|собес|делов/.test(t)) tags.push('офис');
  if (/свидан|вечер|ресторан|праздн/.test(t)) tags.push('свидание');
  if (/прогул|каждый день|повседнев|выходн/.test(t)) tags.push('повседневный');
  if (/классик|строг/.test(t)) tags.push('классика');
  let tone = null;
  if (/т[её]мн|ч[её]рн/.test(t)) tone = 'тёмный';
  if (/светл|бел|молочн|беж/.test(t)) tone = 'светлый';
  const missing = Object.keys(MISSING).filter(k => t.includes(k)).map(k => MISSING[k]);
  return {budget, tags, tone, missing};
}
function scoreP(p, q){
  let sc = 0;
  q.tags.forEach(tg => { if (p.tags.includes(tg)) sc += 3; });
  if (q.tone && p.tone === q.tone) sc += 2;
  if (st.profile?.style && p.tags.includes(st.profile.style)) sc += 1;
  const w = where(p); if (!w.length) return null;
  return sc - w[0].km * 0.4;
}
function buildLook(q, lock = {}, skip = []){
  const cand = c => PRODUCTS.filter(p => p.cat === c && !skip.includes(p.id) && (!lock[c] || lock[c] === p.id))
    .map(p => ({p, sc:scoreP(p, q)})).filter(x => x.sc !== null);
  const tops = cand('top'), bottoms = cand('bottom'), shoes = [null, ...cand('shoes')], bags = [null, ...cand('bag')];
  let best = null;
  for (const a of tops) for (const b of bottoms) for (const c of shoes) for (const d of bags){
    if (lock.shoes && !c) continue; if (lock.bag && !d) continue;
    const items = [a, b, c, d].filter(Boolean);
    const total = items.reduce((s, x) => s + x.p.price, 0);
    if (q.budget && total > q.budget) continue;
    const stores = new Set(items.map(x => where(x.p)[0].s.id));
    const val = items.reduce((s, x) => s + x.sc, 0) + (c ? 4 : 0) + (d ? 2.5 : 0) - stores.size * 0.3 + (SC ? items.reduce((s, x, i) => items.slice(i + 1).reduce((t, y) => t + (compat(x.p.id, y.p.id) - 0.5) * 4, s), 0) : 0);
    if (!best || val > best.val) best = {val, items, total};
  }
  if (!best) return null;
  return {id:'l' + Date.now(), q, title:'', created:Date.now(),
    items:best.items.map(x => { const w = where(x.p)[0]; return {pid:x.p.id, sid:w.s.id, sz:w.sz}; }),
    total:best.total, skip:[...skip]};
}
function routeOrder(sids){
  const left = [...new Set(sids)].map(S), out = []; let cur = ME, dist = 0;
  while (left.length){ left.sort((a, b) => km(a, cur) - km(b, cur)); const n = left.shift(); dist += km(n, cur); out.push(n); cur = n; }
  return {stores:out, dist};
}

   intent — понимание запроса (синтетические фразы с опечатками), photo — CNN по фото (Fashion Product Images),
   compat — сочетаемость вещей (Polyvore), cobuy — «с этим берут» (корзины H&M). Последние две посчитаны для каталога заранее: models/scores.json */

function intentVec(text){ // тот же код, что при обучении: символьные n-граммы 2..4, хэш FNV-1a
  const v = new Float32Array(IN_DIM);
  const t = text.toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я ]+/g, ' ').split(/\s+/).filter(w => w.length > 1);
  for (const w of t){ const s = ' ' + w + ' ';
    for (let n = 2; n <= 4; n++) for (let i = 0; i + n <= s.length; i++){ let h = 2166136261; for (let k = i; k < i + n; k++){ h ^= s.charCodeAt(k); h = Math.imul(h, 16777619); } v[(h >>> 0) % IN_DIM] = 1; } }
  return v;
}

function intentParse(text){

// Небольшие ответы для карточки, поиска и кабинета: ui.ai[key] = {wait} | {text} | {data} | {err}
async function aiRun(key, fn){
  ui.ai = ui.ai || {}; ui.ai[key] = {wait:true}; render();
  try { const v = await fn(); ui.ai[key] = typeof v === 'string' ? {text:v} : {data:v}; }
  catch(e){ console.warn(e); ui.ai[key] = {err:'Модель не смогла обработать запрос'}; }
  render();
}
const aiState = key => (ui.ai || {})[key];
function aiBox(key, empty = ''){

  search: q => { const r = intentParse(q), t = q.toLowerCase();
    const ids = PRODUCTS.map(p => ({p, s:r.tags.filter(g => p.tags.includes(g)).length * 3 + (r.tone && p.tone === r.tone ? 2 : 0) + (r.want.includes(p.cat) ? 4 : 0) + (t.split(/\s+/).some(w => w.length > 3 && p.name.toLowerCase().includes(w.slice(0, -1))) ? 4 : 0)}))

function go(view, params = {}){ ui.stack.push({view, params}); render(true); }

function cur(){ return ui.stack[ui.stack.length - 1] || {view:ui.tab, params:{}}; }
function render(scrollTop){
  const phone = $('#phone');
  if (!st.profile && ui.mode === 'buyer' && cur().view !== 'onb'){ ui.stack = [{view:'onb', params:{}}]; }
  phone.classList.toggle('wide', ui.mode === 'store');
  const v = cur();
  const html = ui.mode === 'store' ? vCabinet() : (VIEWS[v.view] || VIEWS.home)(v.params);
  $('#screen').innerHTML = html;
  $('#tabbar').hidden = ui.mode === 'store' || v.view === 'onb';
  $('#tabbar').innerHTML = [
    ['home', ICON.home, 'Главная'], ['looks', ICON.hanger, 'Образы'], ['fav', ICON.heart, 'Избранное'], ['profile', ICON.user, 'Профиль']
  ].map(([k, ic, t]) => {
    const n = k === 'fav' ? st.fav.length : k === 'profile' ? st.bookings.filter(b => !b.seed && b.status === 'active').length : 0;
    return `<button data-tab="${k}" class="${ui.tab === k && !ui.stack.length ? 'on' : ''}">${ic}${t}${n ? `<span class="cnt">${n}</span>` : ''}</button>`;
  }).join('');
  if (scrollTop) $('#screen').scrollTop = 0;
  afterRender();
}
function afterRender(){

    ${a?.wait ? '<p class="note">ИИ рассматривает фото…</p>' : ''}${a?.err ? `<p class="note">${esc(a.err)}</p>` : ''}
    ${d ? `<div class="tbl"><table><tbody>${[['Название', d.name], ['Категория', CATS[d.cat] || d.cat], ['Тип', d.articleType], ['Цвет', d.color], ['Материал', d.material], ['Сезон', d.season], ['Теги', Array.isArray(d.tags) ? d.tags.join(', ') : d.tags], ['Цена', d.price_from ? `${rub(+d.price_from)} – ${rub(+d.price_to || +d.price_from)}` : ''], ['Описание', d.description]].filter(([, v]) => v).map(([k, v]) => `<tr><td class="sub">${k}</td><td>${esc(v)}</td></tr>`).join('')}</tbody></table></div><p class="note">Проверьте поля перед публикацией: в рабочей версии карточка уходит в каталог после подтверждения магазином.</p>` : ''}
    ${a?.wait ? '' : `<label class="btn ghost" for="cardPhoto" style="cursor:pointer;align-self:flex-start">${d ? 'Другое фото' : 'Загрузить фото товара'}</label>`}<input id="cardPhoto" type="file" accept="image/jpeg,image/png,image/webp" hidden></div>`;
}
CAB.demand = () => {
  const all = [...st.demand.map(d => ({...d, live:true})), ...SEED_DEMAND];
  const max = Math.max(...all.map(d => d.n));
  return `<h1 class="h1" style="font-size:26px">Что ищут в Тюмени и не находят</h1>
    <p class="sub">Запросы покупателей, на которые ни у одного магазина-партнёра не нашлось вещей. Это подсказка, что завезти.</p>
    <div class="panel"><div class="funnel">${all.map(d => `<div class="fbar"><span style="white-space:normal">${esc(d.q)}${d.live ? ' <span class="pill ok">новый</span>' : ''}</span><div class="tr"><i style="width:${Math.max(4, d.n / max * 100)}%"></i></div><b class="num">${d.n}</b></div>`).join('')}</div></div>
    ${AI ? `<div class="panel"><div class="between" style="flex-wrap:wrap"><b>Что завезти: разбор от ИИ</b>${aiTag}</div><span class="sub">Сопоставляем ненайденные запросы, остатки магазина и то, что покупают вместе (модель по корзинам H&M).</span>${aiBox('demand')}${aiState('demand')?.wait ? '' : `<button class="btn sm" style="align-self:flex-start" data-act="aidemand">${aiState('demand') ? 'Разобрать заново' : 'Получить рекомендации'}</button>`}</div>` : ''}
    <p class="note">Данные обезличены: магазин видит только формулировку запроса и сколько раз его задавали, но не видит, кто спрашивал. Подробный отчёт по району и сезону входит в платный тариф.</p>`;
};
CAB.plan = s => `<h1 class="h1" style="font-size:26px">Тариф и API</h1>
  <div class="tariffs">
    <div class="tariff cur"><span class="pill ok">подключён</span><b class="h2">Пилот</b><b class="num">0 ₽ · 3 месяца</b><ul><li>каталог и остатки</li><li>брони и выдача по коду</li><li>базовая статистика</li></ul></div>
    <div class="tariff"><span class="pill n">после пилота</span><b class="h2">Старт</b><b class="num">1 990 ₽/мес + 49 ₽ за визит</b><ul><li>всё из пилота</li><li>платим только за подтверждённых покупателей</li><li>отчёт «что ищут в городе»</li></ul></div>
    <div class="tariff"><span class="pill n">сети</span><b class="h2">Сеть</b><b class="num">от 9 900 ₽/мес</b><ul><li>несколько точек</li><li>интеграция с 1С</li><li>продвижение с пометкой «Реклама»</li></ul></div>
  </div>
  <p class="note">Цены — гипотеза. На пилоте проверяем, готовы ли магазины платить за визит, и только потом фиксируем тариф.</p>
  <div class="panel"><b>Этап 3: наличие для ИИ-ассистентов</b><span class="sub">Через тот же поток данных магазин виден не только в нашем приложении, но и голосовым помощникам, картам и чат-ботам. Ответ сервиса выглядит так:</span>
  <pre class="json">GET /v1/availability?city=tyumen&amp;q=пиджак&amp;size=M

{
  "items": [{
    "product": "Пиджак оверсайз",
    "price": 7990,
    "store": "${esc(s.name)}, ${esc(s.branch)}",
    "size": "M",
    "qty": ${qty('p4', 'stil1', 'M')},
    "updated_min_ago": ${s.upd},
    "reserve_url": "https://vydrochka.ru/r/p4"
  }]
}</pre><span class="note">Адрес и формат условные, в прототипе запрос не выполняется.</span></div>`;

/* ================= ДЕЙСТВИЯ ================= */
function askStylist(text, q = parseQuery(text), silent = false){
  ui.chat = ui.chat.length ? ui.chat : [];
  if (!silent) ui.chat.push({me:true, html:esc(text)});
  if (q.note) ui.chat.push({me:false, html:`<span class="sub">${esc(q.note)}</span>`});
  if (q.missing.length){
    q.missing.forEach(m => { const ex = st.demand.find(d => d.q === m); ex ? ex.n++ : st.demand.unshift({q:m, n:1}); });
    ui.chat.push({me:false, html:`Пока ни у одного магазина-партнёра нет: <b>${q.missing.join(', ')}</b>. Я записал запрос: магазины видят, что это ищут, и сообщат, когда завезут.${q.tags.length || q.budget ? ' А пока собрал то, что есть:' : ''}`});
    if (!q.tags.length && !q.budget){ save(); render(); return; }
  }
  if (!q.budget) q.budget = +st.profile.budget || null;
  if (!q.tags.length) q.tags = [st.profile.style];
  const look = buildLook(q, ui.withItem ? {[P(ui.withItem).cat]:ui.withItem} : {});
  ui.withItem = null;
  if (!look){
    ui.chat.push({me:false, html:`В бюджет ${rub(q.budget)} целый образ (верх и низ) в вашем размере не собирается. Самый дешёвый комплект стоит от ${rub(1990 + 2290)}. Попробуйте поднять бюджет.`});
    save(); render(); return;
  }
  look.title = text;
  if (SC) look.ai = lookExplain(look);
  ui.lastLook = look;
  ui.chat.push({me:false, html:`Готово: ${look.items.length} ${look.items.length === 4 ? 'вещи' : 'вещи'} на ${rub(look.total)} из ${new Set(look.items.map(i => i.sid)).size} магазинов. <button class="link" data-act="openlook" data-id="${look.id}" style="text-decoration:underline">Открыть образ →</button>`});
  look.items.forEach(i => stat(i.sid, 'views'));
  save(); go('look', {id:look.id});
}
function book(pid, sid, sz){
  const left = qty(pid, sid, sz); if (left < 1){ toast('Этот размер уже забрали'); return null; }
  st.inv[pid][sid][sz] = left - 1;
  const b = {id:'b' + Date.now() + Math.random().toString(36).slice(2, 5), code:'ВД-' + (1000 + Math.floor(Math.random() * 9000)), pid, sid, sz, created:Date.now(), status:'active'};
  st.bookings.push(b); stat(sid, 'routes'); return b;
}
function findLook(id){ return st.looks.find(l => l.id === id) || (ui.lastLook?.id === id ? ui.lastLook : null); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab],[data-chip],[data-feat],[data-cab],[data-go],[data-pick] button');
  if (!t) return;
  if (t.matches('[data-pick] button')){
    const box = t.parentElement; box.querySelectorAll('button').forEach(b => b.classList.remove('on')); t.classList.add('on');
    if (box.dataset.pick === 'style') box.querySelectorAll('button').forEach(b => b.className = b === t ? 'chip on' : 'chip');
    return;
  }
  if (t.dataset.tab){ ui.mode = 'buyer'; tab(t.dataset.tab); return; }
  if (t.dataset.chip){ ui.chip = t.dataset.chip; render(); return; }
  if (t.dataset.feat){ ui.feat[t.dataset.feat] = !ui.feat[t.dataset.feat]; render(); return; }
  if (t.dataset.cab){ ui.cabTab = t.dataset.cab; render(true); return; }
  if (t.dataset.go) return guideGo(t.dataset.go);
  const id = t.dataset.id, a = t.dataset.act;
  switch (a){
    case 'back': back(); break;
    case 'menu': tab('profile'); break;
    case 'product': { const p = P(id); stat(Object.keys(p.stock)[0], 'cards'); save(); go('product', {id}); break; }
    case 'fav': st.fav = st.fav.includes(id) ? st.fav.filter(x => x !== id) : [...st.fav, id]; save(); toast(st.fav.includes(id) ? 'Добавили в избранное. Сообщим, если размер закончится' : 'Убрали из избранного'); render(); break;
    case 'pick': ui.pickSize = {...(ui.pickSize || {}), [id]:t.dataset.v}; render(); break;
    case 'stylist': ui.chat = []; go('stylist'); break;
    case 'stylistWith': ui.chat = []; ui.withItem = id; go('stylist'); toast('Стилист соберёт образ вокруг этой вещи'); break;
    case 'ask': AI ? askStylistAI(t.dataset.q) : askStylist(t.dataset.q); break;
    case 'aifit': if (AI) aiRun('fit' + id, () => AI_TASKS.fit(id)); break;
    case 'aidemand': if (AI) aiRun('demand', () => AI_TASKS.demand(S(ui.cabStore))); break;
    case 'catalog': go('catalog', {}); break;
    case 'map': go('map'); break;
    case 'storepage': go('storepage', {id}); break;
    case 'openlook': if (findLook(id)) go('look', {id}); else { ui.lastLook = buildLook({budget:+st.profile.budget, tags:[st.profile.style], tone:null, missing:[]}); ui.lastLook.title = 'Подборка по анкете'; go('look', {id:ui.lastLook.id}); } break;
    case 'swap': {
      const look = findLook(id), i = +t.dataset.i, it = look.items[i], cat = P(it.pid).cat;
      const lock = {}; look.items.forEach((x, j) => { if (j !== i) lock[P(x.pid).cat] = x.pid; });
      const skip = [...(look.skip || []), it.pid];
      const ok = l => l && l.items.find(x => P(x.pid).cat === cat);
      const cats = look.items.map(x => P(x.pid).cat);
      const sk = [...skip.filter(s => P(s).cat === cat), ...PRODUCTS.filter(p => !cats.includes(p.cat)).map(p => p.id)];
      let nl = buildLook(look.q, lock, sk), over = false;
      if (!ok(nl)){ nl = buildLook({...look.q, budget:null}, lock, sk); over = true; }
      if (!ok(nl)){ toast('Других вариантов в вашем размере нет. Начинаем список заново'); look.skip = []; break; }
      look.items = nl.items; look.total = nl.total; look.skip = skip; save(); render();
      toast(over && look.q.budget && nl.total > look.q.budget ? `Заменили, но образ вышел дороже бюджета на ${rub(nl.total - look.q.budget)}` : 'Заменили. Остальные вещи оставили как были'); break;
    }
    case 'savelook': { const look = findLook(id); if (!st.looks.some(l => l.id === id)) st.looks.unshift(look); save(); toast('Образ сохранён во вкладке «Образы»'); render(); break; }
    case 'route': findLook(id).items.forEach(i => stat(i.sid, 'routes')); save(); go('route', {id}); break;
    case 'book': { const b = book(id, t.dataset.sid, t.dataset.sz); if (b){ save(); go('booking', {ids:[b.id]}); } break; }
    case 'bookall': {
      const look = findLook(id); const ids = [];
      look.items.forEach(it => { const b = book(it.pid, it.sid, it.sz); if (b) ids.push(b.id); });
      if (!st.looks.some(l => l.id === id)) st.looks.unshift(look);
      save(); if (ids.length) go('booking', {ids}); break;
    }
    case 'showbk': go('booking', {ids:[id]}); break;
    case 'cancelbk': { const b = st.bookings.find(x => x.id === id); b.status = 'cancel'; st.inv[b.pid][b.sid][b.sz]++; save(); toast('Бронь отменена, вещь вернулась в продажу'); render(); break; }
    case 'report': st.reports[t.dataset.sid] = (st.reports[t.dataset.sid] || 0) + 1; save(); toast('Спасибо! Передали магазину, проверим остатки'); render(); break;
    case 'editprofile': go('onb'); break;
    case 'tostore': ui.mode = 'store'; render(true); break;
    case 'tobuyer': ui.mode = 'buyer'; render(true); break;
    case 'issue': issue(st.bookings.find(b => b.id === id)); break;
  }
});
function issue(b){
  if (!b || b.status !== 'active'){ toast('Такой действующей брони нет'); return; }
  b.status = 'done'; save(); toast(`Визит подтверждён: ${b.code}. Покупатель пришёл через Выдрочку`); render();
}
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'onbForm'){
    if (!$('#f-consent').checked){ toast('Отметьте согласие на обработку данных, без него подбор не работает'); return; }
    const pick = k => f.querySelector(`[data-pick="${k}"] .on`)?.dataset.v;
    st.profile = {city:$('#f-city').value.replace(' (скоро)', ''), size:pick('size'), shoe:pick('shoe'), style:pick('style'), budget:+$('#f-budget').value || 15000};
    if (st.profile.city === 'Курган') toast('Курган подключаем следующим. Пока показываем Тюмень');
    st.profile.city = 'Тюмень';
    save(); ui.stack = []; ui.tab = 'home'; render(true);
  }
  if (f.id === 'searchForm'){ const q = $('#q').value.trim(); const pq = parseQuery(q); if (pq.missing.length){ pq.missing.forEach(m => { const ex = st.demand.find(d => d.q === m); ex ? ex.n++ : st.demand.unshift({q:m, n:1}); }); save(); } go('catalog', {q}); const t = q.toLowerCase(); if (AI && t && !aiState('search' + t)?.data) aiRun('search' + t, () => AI_TASKS.search(q).then(d => { addDemand(Array.isArray(d?.missing) ? d.missing : []); save(); return d; })); }
  if (f.id === 'askForm'){ const v = $('#ask').value.trim(); if (v) AI ? askStylistAI(v) : askStylist(v); }
  if (f.id === 'issueForm'){
    const code = $('#issueCode').value.trim().toUpperCase().replace(/^VD/, 'ВД').replace(/^ВД-?/, 'ВД-');
    issue(st.bookings.find(b => b.code === code && b.sid === ui.cabStore));
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'cabStore'){ ui.cabStore = t.value; render(); }
  if (t.dataset.inv){ const [pid, sid, z] = t.dataset.inv.split('|'); st.inv[pid][sid][z] = Math.max(0, +t.value || 0); save(); toast('Остаток обновлён, покупатели видят его сразу'); }
  if (t.id === 'photo' && t.files[0]){
    const r = new FileReader();
    const file = t.files[0], note = ($('#ask')?.value || '').trim();
    r.onload = () => { ui.chat.push({me:true, html:`<img src="${r.result}" alt="Фото-пример" style="border-radius:12px;max-height:180px">${note ? '<br>' + esc(note) : ''}`}); AI && AI_IMG ? askStylistAI(note || 'Собери похожий образ', file) : askStylist('похожий образ, тёмные цвета, классика'); };
    r.readAsDataURL(file);
  }
  if (t.id === 'cardPhoto' && t.files[0] && AI){ const file = t.files[0]; aiRun('card', () => AI_TASKS.card(file)); }
  if (t.id === 'csv' && t.files[0]){
    const r = new FileReader();
    r.onload = () => {
      let n = 0;
      r.result.split(/\r?\n/).forEach(line => {
        const [name, sz, q] = line.split(/[;,]/).map(x => x && x.trim());
        const p = PRODUCTS.find(x => x.name.toLowerCase() === (name || '').toLowerCase());
        if (p && st.inv[p.id][ui.cabStore] && sz && !isNaN(+q)){ st.inv[p.id][ui.cabStore][sz] = +q; n++; }
      });
      save(); toast(n ? `Обновлено строк: ${n}` : 'Ни одна строка не совпала с товарами магазина'); render();
    };
    r.readAsText(t.files[0]);
  }
});
function guideGo(k){
  if (k === 'reset'){ st = fresh(); ui = {...ui, mode:'buyer', tab:'home', stack:[], chat:[], lastLook:null}; save(); render(true); toast('Демо сброшено'); return; }
  if (!st.profile && k !== 'onb'){ st.profile = {city:'Тюмень', size:'S', shoe:'38', style:'классика', budget:15000}; save(); }
  ui.mode = 'buyer'; ui.stack = []; ui.tab = 'home';
  if (k === 'onb'){ go('onb'); }
  if (k === 'stylist'){ ui.chat = []; go('stylist'); }
  if (k === 'look'){ ui.chat = []; ui.stack = []; askStylist('Образ на учёбу до 15 000 ₽'); }
  if (k === 'product'){ go('product', {id:'p4'}); }
  if (k === 'bookings'){ const b = book('p4', 'stil1', qty('p4', 'stil1', st.profile.size) ? st.profile.size : 'M'); if (b){ save(); go('booking', {ids:[b.id]}); } else go('product', {id:'p4'}); }
  if (k === 'cabinet'){ ui.mode = 'store'; ui.cabTab = 'bk'; ui.cabStore = 'stil1'; render(true); }
  if (k === 'demand'){ ui.mode = 'store'; ui.cabTab = 'demand'; render(true); }
}
render(true);
</script>

</body></html>
